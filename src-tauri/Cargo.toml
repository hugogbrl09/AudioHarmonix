[package]
name = "audioharmonix-tauri"
version = "1.0.0"
description = "AudioHarmonix Desktop App Shell & Backend"
authors = ["AudioHarmonix Team"]
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled", "wal"] }
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"
